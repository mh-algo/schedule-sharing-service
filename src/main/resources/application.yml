spring:
  application:
    name: schedule-sharing-service
  web:
    resources:
      add-mappings: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_URL:localhost}:${DB_PORT:3306}/${DB_NAME:schedule_sharing_service}?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
#          show_sql: true
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-version: 0
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration, classpath:db/data

logging:
  level:
    org.springframework: info
    org.hibernate:
        SQL: debug
        orm.jdbc.bind: trace
#    org.springframework.security: DEBUG
#    org.springframework.security.web.access.ExceptionTranslationFilter: DEBUG
#    org.springframework.security.web.authentication: DEBUG
#    org.springframework.security.access: DEBUG
#    org.apache.catalina.authenticator: DEBUG   # Tomcat AuthenticatorBase 내부 흐름

jwt:
  secret: ${JWT_SECRET}   # base64
  access-token-ttl-ms: 3600000    # 1시간(60 * 60 * 1000)
  refresh-token-ttl-ms: 604800000   # 7일(7 * 24 * 60 * 60 * 1000)
  cleanup:
    enabled: true
    delay-ms: 3600000    # 1시간(60 * 60 * 1000)
    initial-ms: 3600000    # 1시간(60 * 60 * 1000)

sse:
  cache:
    max-entries: 500       # 최근 N개 유지
  emitters:
    ttl-ms: 3600000    # 1시간(60 * 60 * 1000)

notify:
  lease:
    seconds: 10
  retry:
    enabled: true
    delay-ms: 5000  # 5초(5 * 1000)
    retry-delay-sec: 2
    max-retry-delay-sec: 60
    max-attempts: 5
    batch-size: 200